services:
  - type: web
    name: audio-mixer-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ALLOWED_ORIGINS
        value: https://audio-mixer-frontend.onrender.com,https://audio-mixer-frontend.vercel.app,http://localhost:5173
